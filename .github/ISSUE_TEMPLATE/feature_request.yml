name: 功能建议
description: 提出新功能想法或改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景或痛点。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的交互或实现方式。
    validations:
      required: false
