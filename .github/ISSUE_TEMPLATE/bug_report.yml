name: Bug 反馈
description: 报告功能异常或复现问题
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述实际现象与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小可复现命令或步骤。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 例如操作系统、工具版本（`mise --version` 等）。
    validations:
      required: false
