#:schema https://mise.jdx.dev/schema/mise.json

[tools]
uv = "0.13"
hk = "2.12"
ruff = "latest"
ty = "latest"
osv-scanner = "latest"
rumdl = "0.3.3"
lychee = "0.24.2"
typos = "1"
gitleaks = "8"
"github:huacnlee/autocorrect" = "2.16.3"
"github:1jehuang/mermaid-rs-renderer" = "0.3.1"

[tasks."docs:check"]
description = "Run all documentation, lint, and test checks"
run = "hk check --all -q"

[tasks."docs:fix"]
description = "Auto-fix documentation, formatting, and lint issues"
run = "hk fix --all -q"
